<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Game Mewarnai Semangka Edukatif 🍉</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Canvas Confetti CDN -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Google Fonts for Kids -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Mali:wght@600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            font-family: 'Fredoka', cursive, sans-serif;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #FFF9E6;
            background-image: radial-gradient(#FFD1DC 2px, transparent 2px), radial-gradient(#C1E1C1 2px, #FFF9E6 2px);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
        }

        .btn-bounce {
            transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.15s ease;
        }
        .btn-bounce:active {
            transform: scale(0.92);
        }

        .tool-btn.active {
            ring: 4px solid #3B82F6;
            transform: scale(1.08);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2);
        }

        .color-bubble {
            transition: transform 0.2s ease, ring 0.2s ease;
        }
        .color-bubble.active {
            transform: scale(1.22);
            z-index: 10;
        }

        /* Pulsing completion animation */
        @keyframes pulse-star {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.2) rotate(10deg); }
        }
        .star-anim {
            animation: pulse-star 1.5s infinite ease-in-out;
        }

        /* Custom scrollbars */
        ::-webkit-scrollbar {
            height: 10px;
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #FFE4E6;
            border-radius: 20px;
        }
        ::-webkit-scrollbar-thumb {
            background: #FB7185;
            border-radius: 20px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-2 md:p-4 text-slate-800 overflow-x-hidden">

    <!-- Top Header -->
    <header class="max-w-5xl mx-auto w-full bg-white/90 backdrop-blur-md border-4 border-rose-300 rounded-3xl p-3 md:p-4 shadow-lg mb-3 flex flex-wrap items-center justify-between gap-2">
        <div class="flex items-center gap-3">
            <div class="w-12 h-12 md:w-14 md:h-14 bg-gradient-to-tr from-emerald-500 to-green-400 rounded-2xl flex items-center justify-center text-3xl shadow-md border-2 border-white transform -rotate-6">
                🍉
            </div>
            <div>
                <h1 class="text-xl md:text-3xl font-bold bg-gradient-to-r from-rose-500 via-pink-500 to-emerald-600 bg-clip-text text-transparent">
                    Mewarnai Semangka 🎨
                </h1>
                <p class="text-xs md:text-sm text-slate-500 font-semibold hidden sm:block">
                    Yuk hiasi semangka manismu dengan warna-warni indah!
                </p>
            </div>
        </div>

        <!-- Controls: Sound Toggle & Template Selectors -->
        <div class="flex items-center gap-2">
            <button id="soundToggleBtn" onclick="toggleAudio()" class="btn-bounce bg-amber-100 hover:bg-amber-200 border-2 border-amber-400 text-amber-700 px-3 py-2 rounded-2xl font-bold flex items-center gap-2 text-sm shadow-sm" title="Matikan/Hidupkan Suara">
                <i id="soundIcon" class="fa-solid fa-volume-high text-lg"></i>
                <span class="hidden md:inline">Suara: ON</span>
            </button>

            <button onclick="resetCanvas()" class="btn-bounce bg-sky-100 hover:bg-sky-200 border-2 border-sky-400 text-sky-700 px-3 py-2 rounded-2xl font-bold flex items-center gap-2 text-sm shadow-sm" title="Mulai Lagi">
                <i class="fa-solid fa-rotate-left text-lg"></i>
                <span class="hidden md:inline">Mulai Lagi</span>
            </button>

            <button onclick="finishColoring()" class="btn-bounce bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-600 hover:to-teal-600 text-white px-4 py-2 rounded-2xl font-bold flex items-center gap-2 text-sm md:text-base shadow-md border-2 border-white">
                <i class="fa-solid fa-circle-check text-lg"></i>
                <span>Selesai!</span>
            </button>
        </div>
    </header>

    <!-- Main Studio Area -->
    <main class="max-w-5xl mx-auto w-full flex-1 flex flex-col md:flex-row gap-4 items-stretch justify-center mb-3">
        
        <!-- Left Panel: Template Selection & Drawing Tools -->
        <aside class="w-full md:w-64 bg-white/90 backdrop-blur-md border-4 border-amber-200 rounded-3xl p-3 shadow-lg flex flex-col justify-between gap-3">
            
            <!-- Template Selector -->
            <div>
                <h2 class="text-sm font-bold text-amber-800 mb-2 flex items-center gap-2">
                    <i class="fa-solid fa-image text-amber-500"></i> Pilih Gambar Semangka:
                </h2>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="selectTemplate('slice')" id="tpl-slice" class="tpl-btn btn-bounce border-2 border-rose-300 bg-rose-50 p-2 rounded-2xl flex flex-col items-center justify-center text-xs font-bold text-rose-700 hover:bg-rose-100 active:bg-rose-200 ring-2 ring-rose-400">
                        <span class="text-2xl mb-1">🍉</span>
                        <span>Potongan</span>
                    </button>
                    <button onclick="selectTemplate('lollipop')" id="tpl-lollipop" class="tpl-btn btn-bounce border-2 border-pink-200 bg-pink-50 p-2 rounded-2xl flex flex-col items-center justify-center text-xs font-bold text-pink-700 hover:bg-pink-100">
                        <span class="text-2xl mb-1">🍡</span>
                        <span>Es Semangka</span>
                    </button>
                    <button onclick="selectTemplate('whole')" id="tpl-whole" class="tpl-btn btn-bounce border-2 border-emerald-200 bg-emerald-50 p-2 rounded-2xl flex flex-col items-center justify-center text-xs font-bold text-emerald-700 hover:bg-emerald-100">
                        <span class="text-2xl mb-1">🪀</span>
                        <span>Semangka Utuh</span>
                    </button>
                    <button onclick="selectTemplate('party')" id="tpl-party" class="tpl-btn btn-bounce border-2 border-amber-200 bg-amber-50 p-2 rounded-2xl flex flex-col items-center justify-center text-xs font-bold text-amber-700 hover:bg-amber-100">
                        <span class="text-2xl mb-1">☀️</span>
                        <span>Pesta Ceria</span>
                    </button>
                </div>
            </div>

            <!-- Tool Selector (Paint Bucket vs Brush vs Eraser vs Stickers) -->
            <div>
                <h2 class="text-sm font-bold text-slate-700 mb-2 flex items-center gap-2">
                    <i class="fa-solid fa-wand-magic-sparkles text-purple-500"></i> Alat Mewarnai:
                </h2>
                <div class="grid grid-cols-2 gap-2">
                    <button id="tool-bucket" onclick="setTool('bucket')" class="tool-btn active btn-bounce bg-indigo-50 border-2 border-indigo-300 text-indigo-700 p-2.5 rounded-2xl flex items-center gap-2 text-xs font-bold shadow-sm">
                        <i class="fa-solid fa-fill-drip text-lg text-indigo-500"></i>
                        <span>Ember Cat</span>
                    </button>

                    <button id="tool-brush" onclick="setTool('brush')" class="tool-btn btn-bounce bg-indigo-50 border-2 border-indigo-300 text-indigo-700 p-2.5 rounded-2xl flex items-center gap-2 text-xs font-bold shadow-sm">
                        <i class="fa-solid fa-paint-brush text-lg text-rose-500"></i>
                        <span>Kuas Melukis</span>
                    </button>

                    <button id="tool-sticker" onclick="setTool('sticker')" class="tool-btn btn-bounce bg-indigo-50 border-2 border-indigo-300 text-indigo-700 p-2.5 rounded-2xl flex items-center gap-2 text-xs font-bold shadow-sm">
                        <i class="fa-solid fa-face-smile text-lg text-amber-500"></i>
                        <span>Stiker Lucu</span>
                    </button>

                    <button id="tool-eraser" onclick="setTool('eraser')" class="tool-btn btn-bounce bg-indigo-50 border-2 border-indigo-300 text-indigo-700 p-2.5 rounded-2xl flex items-center gap-2 text-xs font-bold shadow-sm">
                        <i class="fa-solid fa-eraser text-lg text-slate-500"></i>
                        <span>Penghapus</span>
                    </button>
                </div>
            </div>

            <!-- Brush Size Slider (Visible when brush or eraser selected) -->
            <div id="brushSizeBox" class="bg-slate-50 border-2 border-slate-200 rounded-2xl p-2.5">
                <div class="flex justify-between text-xs font-bold text-slate-600 mb-1">
                    <span>Ukuran Kuas:</span>
                    <span id="brushSizeVal">15 px</span>
                </div>
                <input type="range" id="brushSize" min="5" max="40" value="15" oninput="updateBrushSize(this.value)" class="w-full accent-rose-500 cursor-pointer">
            </div>

            <!-- Sticker Tray (Visible when sticker mode active) -->
            <div id="stickerTray" class="hidden bg-amber-50 border-2 border-amber-200 rounded-2xl p-2">
                <span class="text-xs font-bold text-amber-800 block mb-1">Pilih Stiker:</span>
                <div class="flex gap-2 overflow-x-auto pb-1 text-2xl">
                    <button onclick="selectSticker('🍉')" class="sticker-opt hover:scale-125 transition p-1">🍉</button>
                    <button onclick="selectSticker('👀')" class="sticker-opt hover:scale-125 transition p-1">👀</button>
                    <button onclick="selectSticker('👑')" class="sticker-opt hover:scale-125 transition p-1">👑</button>
                    <button onclick="selectSticker('🕶️')" class="sticker-opt hover:scale-125 transition p-1">🕶️</button>
                    <button onclick="selectSticker('⭐️')" class="sticker-opt hover:scale-125 transition p-1">⭐️</button>
                    <button onclick="selectSticker('❤️')" class="sticker-opt hover:scale-125 transition p-1">❤️️</button>
                    <button onclick="selectSticker('🌸')" class="sticker-opt hover:scale-125 transition p-1">🌸</button>
                </div>
            </div>

            <!-- Action Buttons: Undo & Download -->
            <div class="flex gap-2">
                <button onclick="undo()" class="flex-1 btn-bounce bg-slate-100 hover:bg-slate-200 border-2 border-slate-300 text-slate-700 py-2 rounded-2xl text-xs font-bold flex items-center justify-center gap-1.5 shadow-sm">
                    <i class="fa-solid fa-rotate-left"></i> Batal
                </button>
                <button onclick="downloadArtwork()" class="flex-1 btn-bounce bg-teal-100 hover:bg-teal-200 border-2 border-teal-400 text-teal-800 py-2 rounded-2xl text-xs font-bold flex items-center justify-center gap-1.5 shadow-sm">
                    <i class="fa-solid fa-download"></i> Simpan
                </button>
            </div>
        </aside>

        <!-- Center Canvas Area -->
        <section class="flex-1 bg-white border-4 border-rose-300 rounded-3xl p-3 shadow-xl flex flex-col items-center justify-center relative overflow-hidden min-h-[380px] md:min-h-[480px]">
            
            <!-- Floating helper hint -->
            <div id="canvasHint" class="absolute top-4 bg-amber-100/90 border border-amber-300 text-amber-800 px-3 py-1 rounded-full text-xs font-bold shadow-sm z-10 flex items-center gap-2 pointer-events-none transition-opacity duration-300">
                <i class="fa-solid fa-lightbulb text-amber-500"></i>
                <span id="hintText">Sentuh / Klik area gambar untuk mewarnai!</span>
            </div>

            <!-- Canvas Container -->
            <div class="w-full h-full flex items-center justify-center relative touch-none" id="canvasWrapper">
                <canvas id="coloringCanvas" class="max-w-full max-h-[460px] rounded-2xl cursor-crosshair shadow-inner bg-white"></canvas>
            </div>
        </section>
    </main>

    <!-- Bottom Color Palette Bar -->
    <footer class="max-w-5xl mx-auto w-full bg-white/90 backdrop-blur-md border-4 border-emerald-300 rounded-3xl p-3 shadow-lg flex flex-col md:flex-row items-center gap-3">
        
        <div class="flex items-center gap-2 shrink-0">
            <span class="text-sm font-bold text-emerald-800 flex items-center gap-1">
                <i class="fa-solid fa-palette text-emerald-500 text-lg"></i> Warna:
            </span>
            <span id="activeColorLabel" class="text-xs font-bold px-3 py-1 bg-emerald-100 text-emerald-800 rounded-full border border-emerald-300">
                Merah Semangka
            </span>
        </div>

        <!-- Color List Swatches -->
        <div class="flex-1 flex items-center gap-2 md:gap-3 overflow-x-auto w-full py-1 px-1 justify-start md:justify-center" id="paletteContainer">
            <!-- Colors dynamically added via JavaScript for interactive sound and labels -->
        </div>

        <!-- Custom Color Picker -->
        <div class="shrink-0 flex items-center gap-2 bg-slate-100 border border-slate-300 rounded-2xl p-1.5">
            <label for="customColor" class="text-xs font-bold text-slate-600 cursor-pointer flex items-center gap-1">
                <i class="fa-solid fa-eye-dropper text-rose-500"></i> Pilih:
            </label>
            <input type="color" id="customColor" value="#FF3B30" onchange="pickCustomColor(this.value)" class="w-8 h-8 rounded-xl border-0 cursor-pointer bg-transparent">
        </div>
    </footer>

    <!-- Appreciation / Finished Dialog Modal -->
    <div id="finishModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white border-4 border-rose-400 rounded-3xl max-w-md w-full p-6 shadow-2xl text-center transform scale-90 transition-all duration-300 relative overflow-hidden" id="modalBox">
            
            <!-- Confetti background accent -->
            <div class="absolute -top-10 -right-10 w-28 h-28 bg-amber-200 rounded-full opacity-50 blur-xl"></div>
            <div class="absolute -bottom-10 -left-10 w-28 h-28 bg-rose-200 rounded-full opacity-50 blur-xl"></div>

            <div class="relative z-10">
                <div class="text-5xl mb-2 flex justify-center gap-2 star-anim">
                    ⭐️ 🌟 ⭐️
                </div>
                
                <h2 class="text-2xl md:text-3xl font-extrabold text-rose-600 mb-2">
                    Luar Biasa! 🎉
                </h2>
                <p class="text-base md:text-lg font-bold text-slate-700 mb-4">
                    "Wah, Semangkamu Indah Sekali! Pintar Banget!" 🍉✨
                </p>

                <!-- Preview thumbnail box -->
                <div class="bg-slate-50 border-2 border-dashed border-rose-300 rounded-2xl p-2 mb-4 max-h-48 flex items-center justify-center">
                    <img id="modalPreviewImg" class="max-h-40 rounded-xl shadow-sm" alt="Hasil Mewarnai Semangka">
                </div>

                <div class="flex flex-col gap-2">
                    <button onclick="downloadArtwork()" class="btn-bounce bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-600 hover:to-teal-600 text-white py-3 px-6 rounded-2xl font-bold text-base shadow-lg flex items-center justify-center gap-2">
                        <i class="fa-solid fa-download text-xl"></i>
                        <span>Download Gambar (Simpan)</span>
                    </button>
                    
                    <button onclick="closeModal()" class="btn-bounce bg-rose-100 hover:bg-rose-200 text-rose-700 border-2 border-rose-300 py-2.5 px-6 rounded-2xl font-bold text-sm">
                        <i class="fa-solid fa-palette"></i> Lanjut Mewarnai
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Game State Variables
        let canvas, ctx;
        let currentTool = 'bucket'; // 'bucket', 'brush', 'sticker', 'eraser'
        let currentColor = '#FF3B30';
        let currentColorName = 'Merah Semangka';
        let currentSticker = '🍉';
        let brushSize = 15;
        let isDrawing = false;
        let undoStack = [];
        const maxUndo = 10;
        let isAudioEnabled = true;

        // Sound Synthesis via Web Audio API (No external sound files required)
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playPopSound(freq = 440) {
            if (!isAudioEnabled) return;
            initAudio();
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(freq * 1.8, audioCtx.currentTime + 0.1);
                
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } catch(e){}
        }

        function playFanfareSound() {
            if (!isAudioEnabled) return;
            initAudio();
            try {
                const notes = [261.63, 329.63, 392.00, 523.25]; // C E G C
                notes.forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime + idx * 0.12);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + idx * 0.12 + 0.4);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(audioCtx.currentTime + idx * 0.12);
                    osc.stop(audioCtx.currentTime + idx * 0.12 + 0.4);
                });
            } catch(e){}
        }

        // Voice speech reader for color names (Indonesian)
        function speakColor(name) {
            if (!isAudioEnabled || !('speechSynthesis' in window)) return;
            try {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(name);
                utterance.lang = 'id-ID';
                utterance.rate = 1.0;
                window.speechSynthesis.speak(utterance);
            } catch(e){}
        }

        function toggleAudio() {
            isAudioEnabled = !isAudioEnabled;
            const icon = document.getElementById('soundIcon');
            const btn = document.getElementById('soundToggleBtn');
            if (isAudioEnabled) {
                icon.className = 'fa-solid fa-volume-high text-lg';
                btn.querySelector('span').innerText = 'Suara: ON';
                playPopSound(500);
            } else {
                icon.className = 'fa-solid fa-volume-xmark text-lg';
                btn.querySelector('span').innerText = 'Suara: OFF';
            }
        }

        // Color Palette Data (Child-friendly palette)
        const colors = [
            { name: 'Merah Semangka', hex: '#FF3B30' },
            { name: 'Merah Muda', hex: '#FF6B81' },
            { name: 'Hijau Tua', hex: '#1E824C' },
            { name: 'Hijau Muda', hex: '#2ECC71' },
            { name: 'Kuning Segar', hex: '#FFD700' },
            { name: 'Oranye Jingga', hex: '#FF8C00' },
            { name: 'Biru Langit', hex: '#3498DB' },
            { name: 'Ungu Manis', hex: '#9B59B6' },
            { name: 'Cokelat Biji', hex: '#5D4037' },
            { name: 'Hitam Pekat', hex: '#212121' },
            { name: 'Putih Bersih', hex: '#FFFFFF' }
        ];

        let currentTemplate = 'slice';

        window.addEventListener('load', () => {
            canvas = document.getElementById('coloringCanvas');
            ctx = canvas.getContext('2d');
            
            setupCanvasSize();
            renderPalette();
            loadTemplate('slice');

            // Canvas Interaction Listeners
            canvas.addEventListener('mousedown', startAction);
            canvas.addEventListener('mousemove', drawAction);
            canvas.addEventListener('mouseup', endAction);
            canvas.addEventListener('mouseleave', endAction);

            // Touch Support for mobile and tablets
            canvas.addEventListener('touchstart', handleTouchStart, { passive: false });
            canvas.addEventListener('touchmove', handleTouchMove, { passive: false });
            canvas.addEventListener('touchend', endAction, { passive: false });

            window.addEventListener('resize', debounceResize);
        });

        function setupCanvasSize() {
            const wrapper = document.getElementById('canvasWrapper');
            const w = Math.min(wrapper.clientWidth - 10, 600);
            const h = Math.min(wrapper.clientHeight - 10, 480);
            
            // Set canvas pixel size
            canvas.width = w || 500;
            canvas.height = h || 420;
        }

        let resizeTimer;
        function debounceResize() {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                // Keep image state on resize
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = canvas.width;
                tempCanvas.height = canvas.height;
                const tempCtx = tempCanvas.getContext('2d');
                tempCtx.drawImage(canvas, 0, 0);

                setupCanvasSize();
                ctx.drawImage(tempCanvas, 0, 0, canvas.width, canvas.height);
            }, 300);
        }

        function saveState() {
            if (undoStack.length >= maxUndo) undoStack.shift();
            undoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
        }

        function undo() {
            if (undoStack.length > 0) {
                const state = undoStack.pop();
                ctx.putImageData(state, 0, 0);
                playPopSound(350);
            }
        }

        // Render Color Swatches
        function renderPalette() {
            const container = document.getElementById('paletteContainer');
            container.innerHTML = '';

            colors.forEach((c, idx) => {
                const bubble = document.createElement('button');
                bubble.className = `color-bubble w-9 h-9 md:w-11 md:h-11 rounded-full border-2 border-white shadow-md flex-shrink-0 cursor-pointer ${idx === 0 ? 'active ring-4 ring-rose-400' : ''}`;
                bubble.style.backgroundColor = c.hex;
                bubble.title = c.name;
                
                bubble.onclick = () => {
                    document.querySelectorAll('.color-bubble').forEach(b => {
                        b.classList.remove('active', 'ring-4', 'ring-rose-400', 'ring-blue-400');
                    });
                    bubble.classList.add('active', 'ring-4', 'ring-rose-400');
                    currentColor = c.hex;
                    currentColorName = c.name;
                    document.getElementById('activeColorLabel').innerText = c.name;
                    playPopSound(520);
                    speakColor(c.name);
                };

                container.appendChild(bubble);
            });
        }

        function pickCustomColor(hex) {
            currentColor = hex;
            currentColorName = 'Warna Pilihan';
            document.getElementById('activeColorLabel').innerText = currentColorName;
            playPopSound(500);
        }

        // Tool Selection Handling
        function setTool(tool) {
            currentTool = tool;
            document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`tool-${tool}`).classList.add('active');

            const brushBox = document.getElementById('brushSizeBox');
            const stickerTray = document.getElementById('stickerTray');
            const hintText = document.getElementById('hintText');

            if (tool === 'brush' || tool === 'eraser') {
                brushBox.classList.remove('hidden');
                stickerTray.classList.add('hidden');
                hintText.innerText = tool === 'brush' ? 'Geser kuas untuk menggambar!' : 'Geser untuk menghapus!';
            } else if (tool === 'sticker') {
                brushBox.classList.add('hidden');
                stickerTray.classList.remove('hidden');
                hintText.innerText = 'Sentuh canvas untuk menempel stiker!';
            } else {
                brushBox.classList.add('hidden');
                stickerTray.classList.add('hidden');
                hintText.innerText = 'Sentuh / Klik bagian gambar untuk mewarnai!';
            }

            playPopSound(480);
        }

        function updateBrushSize(val) {
            brushSize = parseInt(val);
            document.getElementById('brushSizeVal').innerText = `${val} px`;
        }

        function selectSticker(emoji) {
            currentSticker = emoji;
            playPopSound(600);
        }

        function selectTemplate(tpl) {
            currentTemplate = tpl;
            document.querySelectorAll('.tpl-btn').forEach(b => b.classList.remove('ring-2', 'ring-rose-400', 'bg-rose-50'));
            const btn = document.getElementById(`tpl-${tpl}`);
            if (btn) btn.classList.add('ring-2', 'ring-rose-400', 'bg-rose-50');
            
            loadTemplate(tpl);
            playPopSound(550);
        }

        function resetCanvas() {
            saveState();
            loadTemplate(currentTemplate);
            playPopSound(300);
        }

        function loadTemplate(tpl) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const w = canvas.width;
            const h = canvas.height;
            const cx = w / 2;
            const cy = h / 2;

            ctx.lineWidth = 6;
            ctx.strokeStyle = '#212121';
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            if (tpl === 'slice') {
                // Cute Smiling Watermelon Slice
                drawWatermelonSlice(cx, cy, Math.min(w, h) * 0.38);
            } else if (tpl === 'lollipop') {
                // Watermelon Popsicle Ice Cream
                drawWatermelonPopsicle(cx, cy, Math.min(w, h) * 0.38);
            } else if (tpl === 'whole') {
                // Whole Watermelon & Slice
                drawWholeWatermelon(cx, cy, Math.min(w, h) * 0.35);
            } else if (tpl === 'party') {
                // Watermelon with Sun & Clouds
                drawPartyWatermelon(cx, cy, Math.min(w, h) * 0.35);
            }

            undoStack = []; // Reset undo on fresh template
        }

        // Line Art 1: Watermelon Slice
        function drawWatermelonSlice(cx, cy, radius) {
            ctx.beginPath();
            // Outer Rind Curve
            ctx.arc(cx, cy - 20, radius, 0.1 * Math.PI, 0.9 * Math.PI, false);
            ctx.lineTo(cx, cy - 20);
            ctx.closePath();
            ctx.stroke();

            // Inner Flesh Line
            ctx.beginPath();
            ctx.arc(cx, cy - 20, radius - 22, 0.1 * Math.PI, 0.9 * Math.PI, false);
            ctx.stroke();

            // Cute Eyes & Smile
            drawCuteFace(cx, cy + 20);

            // Watermelon Seeds
            drawSeed(cx - radius * 0.4, cy - 10);
            drawSeed(cx + radius * 0.4, cy - 10);
            drawSeed(cx - radius * 0.2, cy - 50);
            drawSeed(cx + radius * 0.2, cy - 50);
            drawSeed(cx, cy - 70);
        }

        // Line Art 2: Watermelon Ice Cream / Popsicle
        function drawWatermelonPopsicle(cx, cy, size) {
            // Triangular Ice Cream Body
            ctx.beginPath();
            ctx.moveTo(cx, cy - size);
            ctx.lineTo(cx + size * 0.7, cy + size * 0.4);
            ctx.lineTo(cx - size * 0.7, cy + size * 0.4);
            ctx.closePath();
            ctx.stroke();

            // Rind divider line
            ctx.beginPath();
            ctx.moveTo(cx - size * 0.6, cy + size * 0.25);
            ctx.lineTo(cx + size * 0.6, cy + size * 0.25);
            ctx.stroke();

            // Ice Cream Stick
            ctx.beginPath();
            ctx.rect(cx - 18, cy + size * 0.4, 36, size * 0.5);
            ctx.stroke();

            // Cute Face
            drawCuteFace(cx, cy - 10);

            // Seeds
            drawSeed(cx - 25, cy - size * 0.4);
            drawSeed(cx + 25, cy - size * 0.4);
            drawSeed(cx, cy - size * 0.6);
        }

        // Line Art 3: Whole Watermelon
        function drawWholeWatermelon(cx, cy, r) {
            // Big Oval
            ctx.beginPath();
            ctx.ellipse(cx, cy, r * 0.9, r * 0.75, 0, 0, Math.PI * 2);
            ctx.stroke();

            // Watermelon Stripes
            for (let i = -2; i <= 2; i++) {
                ctx.beginPath();
                ctx.moveTo(cx + i * (r * 0.25), cy - r * 0.65);
                ctx.quadraticCurveTo(cx + i * (r * 0.35) + 20, cy, cx + i * (r * 0.25), cy + r * 0.65);
                ctx.stroke();
            }

            // Stem at top
            ctx.beginPath();
            ctx.moveTo(cx, cy - r * 0.75);
            ctx.quadraticCurveTo(cx - 15, cy - r * 0.9, cx - 25, cy - r * 0.85);
            ctx.lineWidth = 8;
            ctx.stroke();
            ctx.lineWidth = 6;
        }

        // Line Art 4: Watermelon Party with Sun & Stars
        function drawPartyWatermelon(cx, cy, size) {
            drawWatermelonSlice(cx, cy + 30, size * 0.8);

            // Sun in top left
            ctx.beginPath();
            ctx.arc(80, 80, 30, 0, Math.PI * 2);
            ctx.stroke();
            // Sun rays
            for (let a = 0; a < Math.PI * 2; a += Math.PI / 4) {
                ctx.beginPath();
                ctx.moveTo(80 + Math.cos(a) * 35, 80 + Math.sin(a) * 35);
                ctx.lineTo(80 + Math.cos(a) * 48, 80 + Math.sin(a) * 48);
                ctx.stroke();
            }

            // Cloud in top right
            ctx.beginPath();
            ctx.arc(canvas.width - 90, 70, 20, 0, Math.PI * 2);
            ctx.arc(canvas.width - 70, 60, 25, 0, Math.PI * 2);
            ctx.arc(canvas.width - 50, 70, 20, 0, Math.PI * 2);
            ctx.stroke();
        }

        // Helper: Cute Eyes and Smile
        function drawCuteFace(x, y) {
            // Left Eye
            ctx.beginPath();
            ctx.arc(x - 30, y - 10, 8, 0, Math.PI * 2);
            ctx.fillStyle = '#212121';
            ctx.fill();

            // Right Eye
            ctx.beginPath();
            ctx.arc(x + 30, y - 10, 8, 0, Math.PI * 2);
            ctx.fill();

            // Smile Mouth
            ctx.beginPath();
            ctx.arc(x, y + 5, 16, 0.1 * Math.PI, 0.9 * Math.PI, false);
            ctx.stroke();
        }

        // Helper: Watermelon Seed
        function drawSeed(x, y) {
            ctx.beginPath();
            ctx.ellipse(x, y, 6, 10, 0, 0, Math.PI * 2);
            ctx.fillStyle = '#212121';
            ctx.fill();
        }

        function getCanvasCoords(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: Math.round((clientX - rect.left) * (canvas.width / rect.width)),
                y: Math.round((clientY - rect.top) * (canvas.height / rect.height))
            };
        }

        function handleTouchStart(e) {
            e.preventDefault();
            startAction(e);
        }

        function handleTouchMove(e) {
            e.preventDefault();
            drawAction(e);
        }

        function startAction(e) {
            const pos = getCanvasCoords(e);
            saveState();

            if (currentTool === 'bucket') {
                floodFill(pos.x, pos.y, currentColor);
                playPopSound(500);
            } else if (currentTool === 'sticker') {
                ctx.font = '36px serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(currentSticker, pos.x, pos.y);
                playPopSound(620);
            } else {
                isDrawing = true;
                ctx.beginPath();
                ctx.moveTo(pos.x, pos.y);
            }
        }

        function drawAction(e) {
            if (!isDrawing) return;
            const pos = getCanvasCoords(e);

            ctx.lineWidth = brushSize;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            if (currentTool === 'brush') {
                ctx.strokeStyle = currentColor;
                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();
            } else if (currentTool === 'eraser') {
                ctx.strokeStyle = '#FFFFFF';
                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();
            }
        }

        function endAction() {
            if (isDrawing) {
                isDrawing = false;
                ctx.closePath();
            }
        }

        // Flood Fill Algorithm for Paint Bucket
        function floodFill(startX, startY, fillColorHex) {
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imgData.data;

            const targetRgb = getPixelRgb(data, startX, startY, canvas.width);
            const fillRgb = hexToRgb(fillColorHex);

            // Don't fill if color is nearly identical
            if (colorMatch(targetRgb, fillRgb, 10)) return;

            const pixelStack = [[startX, startY]];
            const width = canvas.width;
            const height = canvas.height;

            while (pixelStack.length) {
                const newPos = pixelStack.pop();
                const x = newPos[0];
                let y = newPos[1];

                let pixelPos = (y * width + x) * 4;

                while (y >= 0 && colorMatch(getPixelRgbAtPos(data, pixelPos), targetRgb, 50)) {
                    y--;
                    pixelPos -= width * 4;
                }

                pixelPos += width * 4;
                y++;

                let reachLeft = false;
                let reachRight = false;

                while (y < height && colorMatch(getPixelRgbAtPos(data, pixelPos), targetRgb, 50)) {
                    setPixelRgbAtPos(data, pixelPos, fillRgb);

                    if (x > 0) {
                        if (colorMatch(getPixelRgbAtPos(data, pixelPos - 4), targetRgb, 50)) {
                            if (!reachLeft) {
                                pixelStack.push([x - 1, y]);
                                reachLeft = true;
                            }
                        } else if (reachLeft) {
                            reachLeft = false;
                        }
                    }

                    if (x < width - 1) {
                        if (colorMatch(getPixelRgbAtPos(data, pixelPos + 4), targetRgb, 50)) {
                            if (!reachRight) {
                                pixelStack.push([x + 1, y]);
                                reachRight = true;
                            }
                        } else if (reachRight) {
                            reachRight = false;
                        }
                    }

                    y++;
                    pixelPos += width * 4;
                }
            }

            ctx.putImageData(imgData, 0, 0);
        }

        function getPixelRgb(data, x, y, width) {
            const i = (y * width + x) * 4;
            return [data[i], data[i + 1], data[i + 2], data[i + 3]];
        }

        function getPixelRgbAtPos(data, pos) {
            return [data[pos], data[pos + 1], data[pos + 2], data[pos + 3]];
        }

        function setPixelRgbAtPos(data, pos, rgb) {
            data[pos] = rgb[0];
            data[pos + 1] = rgb[1];
            data[pos + 2] = rgb[2];
            data[pos + 3] = 255;
        }

        function colorMatch(a, b, tolerance = 30) {
            return Math.abs(a[0] - b[0]) <= tolerance &&
                   Math.abs(a[1] - b[1]) <= tolerance &&
                   Math.abs(a[2] - b[2]) <= tolerance &&
                   Math.abs(a[3] - b[3]) <= tolerance;
        }

        function hexToRgb(hex) {
            let c = hex.replace('#', '');
            if (c.length === 3) c = c.split('').map(x => x + x).join('');
            const num = parseInt(c, 16);
            return [(num >> 16) & 255, (num >> 8) & 255, num & 255, 255];
        }

        function finishColoring() {
            playFanfareSound();

            // Trigger Confetti Celebration
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 120,
                    spread: 80,
                    origin: { y: 0.6 }
                });
            }

            // Set modal preview image
            const modalPreviewImg = document.getElementById('modalPreviewImg');
            modalPreviewImg.src = canvas.toDataURL('image/png');

            // Show modal
            const modal = document.getElementById('finishModal');
            const modalBox = document.getElementById('modalBox');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modalBox.classList.remove('scale-90');
                modalBox.classList.add('scale-100');
            }, 10);

            // Voice praise
            if (isAudioEnabled && 'speechSynthesis' in window) {
                try {
                    window.speechSynthesis.cancel();
                    const praise = new SpeechSynthesisUtterance("Luar biasa! Semangkamu cantik sekali!");
                    praise.lang = 'id-ID';
                    window.speechSynthesis.speak(praise);
                } catch(e){}
            }
        }

        function closeModal() {
            const modal = document.getElementById('finishModal');
            modal.classList.add('hidden');
            playPopSound(400);
        }

        function downloadArtwork() {
            const link = document.createElement('a');
            link.download = `Semangka-Cantikku-${Date.now()}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
            playPopSound(500);
        }
    </script>
</body>
